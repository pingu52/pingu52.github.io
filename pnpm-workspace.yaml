packages:
  - .

overrides:
  # shortcut: plugin-author CLI commands are unsupported here; remove after Swup cleans its dependencies.
  "@swup/plugin@3.0.1>microbundle": "-"
  "@swup/plugin@3.0.1>shelljs": "-"
  "@swup/plugin@3.0.1>shelljs-live": "-"
  # shortcut: Stylus pins obsolete glob; remove when its range supports glob 13.
  stylus>glob: 13.0.6
  # shortcut: requires Node 22.12+ or 24 for CJS/ESM interop; remove when PostCSS updates Nanoid.
  postcss>nanoid: 6.0.2
  # shortcut: parents still require vulnerable versions; remove when their ranges are patched.
  katex: 0.18.10
  postcss-selector-parser: 7.1.6
  # shortcut: newer releases require an unpublished codec; remove after a valid release.
  astro>magic-string: 1.2.1
  # shortcut: 2.0.4 requires unpublished factory packages; remove after a valid release.
  micromark-core-commonmark: 2.0.3

allowBuilds:
  esbuild: true
