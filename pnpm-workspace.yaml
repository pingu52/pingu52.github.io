packages:
  - .

overrides:
  # shortcut: plugin-author builds are unsupported here; remove when Swup drops microbundle.
  "@swup/plugin@3.0.1>microbundle": "-"
  # shortcut: the glob CLI is unsupported here; remove when Stylus upgrades glob.
  "glob@10.5.0>jackspeak": "-"
  # shortcut: parents still require vulnerable versions; remove when their ranges are patched.
  katex: 0.18.10
  postcss-selector-parser: 7.1.6
  # shortcut: newer releases require an unpublished codec; remove after a valid release.
  astro>magic-string: 1.2.1
  # shortcut: 2.0.4 requires unpublished factory packages; remove after a valid release.
  micromark-core-commonmark: 2.0.3

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - nanoid@3.3.18
